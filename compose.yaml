name: tidarr-token-helper

services:
  tidarr-token-helper:
    # Stable, pinned release. Change the tag when you choose to update.
    image: ghcr.io/foreignwelcome/tidarr-token-helper:v1.0.0
    # To follow every stable release automatically, use:
    # image: ghcr.io/foreignwelcome/tidarr-token-helper:latest

    container_name: tidarr-token-helper

    # Change this to the UID:GID that should own the generated auth.json.
    # TrueNAS SCALE commonly uses 568:568 for the apps user.
    user: "568:568"

    environment:
      TZ: "Etc/UTC"  #edit your time zone
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"

      # Change this password before deployment.
      APP_USERNAME: "admin"
      APP_PASSWORD: "change-this-password-before-deploy"

      AUTH_OUTPUT_PATH: "/output/auth.json"
      STATE_TTL_SECONDS: "900"
      MAX_BODY_BYTES: "131072"

    ports:
      - "8788:8080"

    volumes:
      # Safe default test location beside compose.yaml.
      # Replace ./output with the host path to Tidarr's .tiddl directory
      # when you are ready to create the real auth.json.
      - type: bind
        source: ./output #your path to tiddl should be smth like /mnt/pool/tidarr/config/.tiddl
        target: /output #leave as is 

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    init: true

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    mem_limit: 128m
    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
